<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function display(){
            var num1 = parseInt(document.getElementById("n1").value);
              var num2 = parseInt(document.getElementById("n2").value);
              var add = num1 + num2;
              document.getElementById("res").value=add
        }
         function multiply(){
            var num1 = parseInt(document.getElementById("n1").value);
              var num2 = parseInt(document.getElementById("n2").value);
              var add = num1 * num2;
              document.getElementById("res").value=add
        }
         function substract(){
            var num1 = parseInt(document.getElementById("n1").value);
              var num2 = parseInt(document.getElementById("n2").value);
              var add = num1 - num2;
              document.getElementById("res").value=add
        }
        function division(){
            var num1 = parseInt(document.getElementById("n1").value);
              var num2 = parseInt(document.getElementById("n2").value);
              var add = num1 / num2;
              document.getElementById("res").value=add
        }
        function modules(){
            var num1 = parseInt(document.getElementById("n1").value);
              var num2 = parseInt(document.getElementById("n2").value);
              var add = num1 % num2;
              document.getElementById("res").value=add
        }
        function exponent(){
            var num1 = parseInt(document.getElementById("n1").value);
              var num2 = parseInt(document.getElementById("n2").value);
              var add = num1 ** num2;
              document.getElementById("res").value=add
        }
    </script>
<!-- css page -->


<style>
    
   
    button{
        background-color:plum;
    color: black;
    height: 30px;
    width: 80px;
    text-align: center;
    border-radius: 5px;
    
    }
    input{
        /* display: flex;
    text-align: center;
    justify-content: center; */
    border-radius: 20px;
    height:30px;
    }
    button:hover{
        background-color: violet;
        border-radius: 30%;
    }
    .line{
        display: flex;
        width:400px;
        flex-wrap: wrap;
        gap:40px;
        justify-content: center;
        text-align: center;
    }
    .box{
        display:flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
       border-radius: 30px;
       border:2px solid black;
       height:500px;
       width:500px;
        gap:50px;
        background:linear-gradient(#67A2C5, #7887e3 )
    }
</style>




</head>
<body>
  
    <div class="box">
        <div><label>Enter Num1 :</label>
        <input type="text" placeholder="enter the num1" id="n1"></div>
        <div><label>Enter Num2 :</label>
        <input type="text" placeholder="enter the num2" id="n2"><br></div>
        <!-- result -->
        <div style="margin-left: 40px;"><label>Result :</label>
        <input type="text"  placeholder= "num1+num2" id="res" readonly/><br></div>
        <!-- button -->
         <div class="line">
         <div><button onclick="display()">add(+)</button></div>
         <div><button onclick="multiply()">Multiply(*)</button></div>
         <div><button onclick="substract()">substract(-)</button></div>
         <div><button onclick="division()">division(/)</button></div>
         <div><button onclick="modules()">modules(%)</button></div>
        <div><button onclick="exponent()">exponent(**)</button></div>
        </div>
    </div>
</body>
</html>
